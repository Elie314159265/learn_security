[SERVICE]
    Flush         5
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ─────────────────────────────────────────
# INPUT: Docker fluentd ログドライバーから受信
# 各コンテナが localhost:24224 へ Forward プロトコルで送信してくる
# レコードには log, container_name, container_id, source が含まれる
# ─────────────────────────────────────────
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# ─────────────────────────────────────────
# OUTPUT: Loki へ転送
# container_name と source(stdout/stderr) をラベルとして付与
# ─────────────────────────────────────────
[OUTPUT]
    Name          loki
    Match         *
    Host          loki
    Port          3100
    Labels        job=fluent-bit
    Label_Keys    $container_name,$source
    Remove_Keys   $container_name,$source,$container_id
    Line_Format   json
